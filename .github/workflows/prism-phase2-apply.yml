name: Apply Prism Phase 2 integration
on:
  push:
    branches: [feature/prism-overlay-ui]
    paths:
      - scripts/phase2_apply.py
      - .github/workflows/prism-phase2-apply.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply modal and typography refinements
        run: python scripts/phase2_refine.py
      - name: Commit on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Prism CI"
          git config user.email "prism-ci@users.noreply.github.com"
          git add src/game/client/components/menus.cpp src/game/client/components/menus_settings_prism.cpp
          git diff --cached --check
          git diff --cached --quiet && { echo "No source changes"; exit 1; }
          git commit -m "fix(prism): improve menu typography and close color popups safely"
          git push origin HEAD:feature/prism-overlay-ui
