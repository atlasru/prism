name: Import DDNet foundation
on:
  push:
    branches: [feature/prism-v0.1.0-windows]
    paths: [.github/workflows/prism-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve upstream history on feature branch
        shell: bash
        run: |
          set -euo pipefail
          upstream=a5a61806e434ef22141b622db989087fbba8ed21
          git config user.name "Prism CI"
          git config user.email "prism-ci@users.noreply.github.com"
          git remote add upstream https://github.com/ddnet/ddnet.git
          git fetch --no-tags upstream "$upstream"
          if git merge-base --is-ancestor "$upstream" HEAD; then exit 0; fi
          git merge -s ours --no-commit --allow-unrelated-histories "$upstream"
          git restore --source="$upstream" --staged --worktree -- . ':!.github/workflows' ':!README.md'
          git commit -m "build: import DDNet 20.0 preserving upstream ancestry"
          git push origin HEAD:feature/prism-v0.1.0-windows
