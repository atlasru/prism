name: Prism Windows
on:
  push:
    branches: [feature/prism-v0.1.0-windows, feature/prism-overlay-ui, feature/prism-phase3-qol-identity, feature/prism-visual-identity-vnext, main]
  pull_request:
    branches: [feature/prism-v0.1.0-windows, feature/prism-overlay-ui, feature/prism-phase3-qol-identity, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prism-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify triggering revision
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne '${{ github.sha }}') { throw "Unexpected checkout: $actual" }
          git diff --exit-code
          git submodule status --recursive
          New-Item -ItemType Directory -Force build | Out-Null
          $actual | Set-Content build/TESTED_COMMIT.txt
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.configuration }} -DCMAKE_RUNTIME_OUTPUT_DIRECTORY_${{ matrix.configuration == 'Release' && 'RELEASE' || 'DEBUG' }}=. -DDOWNLOAD_GTEST=ON -DCLIENT=ON -DSERVER=ON -DTOOLS=OFF -DVULKAN=OFF -DAUTOUPDATE=OFF -DSTEAM=OFF -DDISCORD=OFF -DTESTRUNNER_ARGS=--gtest_output=xml:tests.xml
      - name: Build client and tests
        run: cmake --build build --config ${{ matrix.configuration }} --target game-client testrunner --parallel 4
      - name: Run tests
        run: cmake --build build --config ${{ matrix.configuration }} --target run_tests
      - name: Package
        if: matrix.configuration == 'Release'
        run: cmake --build build --config Release --target package_default
      - name: Verify distribution
        id: package
        if: matrix.configuration == 'Release'
        env:
          PRISM_EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/package_prism.py build
      - name: Packaged client smoke
        if: matrix.configuration == 'Release'
        run: python scripts/smoke_prism.py build/verified-package/Prism
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release' && success()
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/*
          if-no-files-found: error
      - name: Preserve test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prism-tests-${{ matrix.configuration }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/TESTED_COMMIT.txt
            build/tests.xml
            build/CMakeFiles/CMakeConfigureLog.yaml
            dist/runtime-smoke.json
          if-no-files-found: warn
